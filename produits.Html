<title>Produits</title>

<style>
body {
    font-family: Arial;
    margin: 0;
    background: #f7f4f4;
}

/* Navbar */
.navbar {
    background: rgb(250, 178, 224);
    padding: 15px;
}
.navbar a {
    color: rgb(249, 247, 247);
    margin: 10px;
    text-decoration: none;
}

/* Title */
h1 {
    text-align: center;
    margin: 20px;
}

/* Products */
.container {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 20px;
    padding: 20px;
}

.card {
    background: rgb(248, 244, 244);
    padding: 15px;
    border-radius: 10px;
    text-align: center;
    transition: 0.3s;
}
.card:hover {
    transform: scale(1.05);
}

.card img {
    width: 100%;
    height: 200px;
    object-fit: cover;
}

button {
    background: rgb(227, 159, 248);
    color: rgb(248, 244, 244);
    border: none;
    padding: 10px;
    margin-top: 10px;
    cursor: pointer;
}
button:hover {
    background: rgb(5, 173, 5);
}
</style>

</head>
